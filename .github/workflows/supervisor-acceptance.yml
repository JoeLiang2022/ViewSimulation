name: supervisor-acceptance
on: workflow_dispatch  # 只給總管 CI 讀 run: 步驟；不讓 GitHub Actions 自動執行
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright (Python)
        run: pip install --quiet playwright==1.65.2
      - name: Syntax check all JS files
        run: |
          set -e
          find js data -name '*.js' -print -exec node --check {} \;
      - name: Browser acceptance tests
        run: python3 -m unittest tests.test_browser -v
